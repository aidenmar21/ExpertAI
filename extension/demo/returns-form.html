<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Returns · Harbor Lane POS</title>
  <!-- Fake third-party returns screen for demoing the ExpertAI extension. Not a real product. Nothing is sent anywhere. -->
  <style>
    :root { color-scheme: light dark; --bg: light-dark(#eef1f5, #12161c); --panel: light-dark(#fff, #1b2129);
      --ink: light-dark(#1f2933, #e4e9f0); --muted: light-dark(#5b6876, #9aa7b5); --line: light-dark(#cfd6de, #333d49);
      --brand: light-dark(#0f766e, #2dd4bf); --brand-ink: light-dark(#fff, #062421); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header b { color: var(--brand); letter-spacing: 0.02em; }
    header span { color: var(--muted); font-size: 13px; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input, select, textarea { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--panel); color: var(--ink); font: inherit; }
    textarea { min-height: 72px; resize: vertical; }
    .full { grid-column: 1 / -1; }
    fieldset { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px 14px; margin: 18px 0 0; }
    legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    button { min-height: 42px; padding: 0 18px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      font: 600 15px/1 inherit; cursor: pointer; }
    button.go { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
    #log { margin-top: 16px; font-size: 13px; color: var(--muted); min-height: 20px; }
    #log.ok { color: var(--brand); }
  </style>
</head>
<body>
  <header><b>HARBOR LANE POS</b><span>Store 114 · Register 3 · Returns desk</span></header>
  <main>
    <form id="return-form" autocomplete="off">
      <h1>Process a return</h1>
      <p class="sub">Scan or type the receipt, check the item, choose how the customer is paid back.</p>
      <div class="grid">
        <div><label for="receipt">Receipt no.</label><input id="receipt" name="receipt" placeholder="R-00000" /></div>
        <div><label for="purchase">Purchase date</label><input id="purchase" name="purchase" type="date" /></div>
        <div><label for="item">Item</label><input id="item" name="item" /></div>
        <div><label for="price">Price</label><input id="price" name="price" inputmode="decimal" placeholder="$0.00" /></div>
        <div>
          <label for="condition">Condition</label>
          <select id="condition" name="condition">
            <option>Unopened</option><option>Opened, like new</option><option>Damaged</option>
          </select>
        </div>
        <div>
          <label for="refund-to">Refund to</label>
          <select id="refund-to" name="refund_to">
            <option>Original card</option><option>Cash</option><option>Store credit</option>
          </select>
        </div>
        <div class="full"><span>Reason for return</span><textarea name="reason" aria-label="Reason for return"></textarea></div>
      </div>
      <fieldset>
        <legend>Payment details (only if the card changed)</legend>
        <div class="grid">
          <div><label for="cc">Card number</label><input id="cc" name="cc" inputmode="numeric" placeholder="•••• •••• •••• ••••" /></div>
          <div><label for="pin">Manager PIN</label><input id="pin" name="pin" type="password" /></div>
        </div>
      </fieldset>
      <div class="bar">
        <button type="submit" class="go" name="op" value="refund">Refund</button>
        <button type="submit" name="op" value="credit">Store credit</button>
        <button type="button" id="lookup">Look up receipt</button>
      </div>
      <p id="log" role="status"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("return-form");
    const log = document.getElementById("log");
    document.getElementById("lookup").addEventListener("click", () => {
      const r = document.getElementById("receipt");
      if (!r.value) r.value = "R-88104";
      document.getElementById("item").value = "Trailhead 2 hiking boots";
      document.getElementById("price").value = "$149.00";
      document.getElementById("purchase").value = "2026-08-12";
      for (const id of ["receipt", "item", "price", "purchase"]) document.getElementById(id).dispatchEvent(new Event("change", { bubbles: true }));
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault(); // demo only: nothing is sent anywhere
      const op = e.submitter ? e.submitter.textContent.trim() : "Submit";
      window.__saved = (window.__saved || 0) + 1;
      log.className = "ok";
      log.textContent = `${op} saved for ${document.getElementById("receipt").value || "(no receipt)"} at ${new Date().toLocaleTimeString()}.`;
    });
  </script>
</body>
</html>
